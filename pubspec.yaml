name: yusal
description: 手动搭建自建房平面与三维结构。
publish_to: none
version: 0.4.0+5
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  cue: ^0.4.0
  cupertino_icons: ^1.0.9
  file_selector: ^1.1.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_sign_in: ^7.2.0
  http: ^1.5.0
  indexd_stack_dev: ^0.4.0
  motor: ^1.1.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^7.0.1
  uuid: ^4.6.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  file_selector_platform_interface: ^2.7.0
flutter:
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
        - asset: assets/fonts/Onest-800.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-500.ttf
          weight: 500
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
        - asset: assets/fonts/Lora-700.ttf
          weight: 700
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
