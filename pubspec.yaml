name: yusal
description: 手动搭建自建房平面与三维结构。
publish_to: none
version: 0.4.0+5
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  audioplayers: ^6.8.1
  cue: ^0.4.0
  device_info_plus: ^13.3.0
  file_selector: ^1.1.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  hive_ce_flutter: ^2.6.0
  hooks: ^2.0.0
  http: ^1.5.0
  meta: ^1.19.0
  indexd_stack_dev: ^0.4.0
  motor: ^1.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.12.0
  qazvoice: ^0.0.4
  record: ^7.2.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.5
  sign_in_with_apple: ^7.0.1
  uuid: ^4.6.0
  vector_math: ^2.2.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  file_selector_platform_interface: ^2.7.0
flutter:
  uses-material-design: true
  # Shorebird reads its app_id from here at runtime.
  assets:
    - shorebird.yaml
    # The 3D view's GPU shaders, compiled by hook/build.dart.
    - build/shaderbundles/scene.shaderbundle
  fonts:
    # Inter and Inter Display, per the Yusal logo book; full Kazakh and
    # Russian Cyrillic.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.otf
        - asset: assets/fonts/Inter-500.otf
          weight: 500
        - asset: assets/fonts/Inter-600.otf
          weight: 600
        - asset: assets/fonts/Inter-700.otf
          weight: 700
        - asset: assets/fonts/Inter-800.otf
          weight: 800
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-600.otf
          weight: 600
    # The Yusal icon set, built by tool/brand/gen_yicons.py.
    - family: YusalIcons
      fonts:
        - asset: assets/fonts/YusalIcons.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
